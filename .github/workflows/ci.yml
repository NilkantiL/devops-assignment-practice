name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: ./app

      - name: Test app
        run: node index.js
        working-directory: ./app

      - name: Build Docker image
        run: docker build -t mynodeapp ./app

      - name: Run Docker container
        run: docker run --rm mynodeapp

